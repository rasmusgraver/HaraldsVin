<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haralds vintrekking</title>
    <link rel="shortcut icon" href="#" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app" aria-labelledby="page-title">
      <h1 id="page-title">Haralds vintrekking</h1>

      <div id="container">
        <div id="top">
          <img
            src="./bilder/Harald_bibliotek.jpg"
            id="bilde1"
            class="Harald"
            alt="Bilde av Harald"
          />

          <div id="topNumber" aria-live="polite" aria-atomic="true">0</div>
        </div>

        <div id="bottom">
          <div class="bottom_left">
            <label for="min">Minimum:</label>
            <input type="number" id="min" min="0" step="1" value="1" />
          </div>

          <div class="bottom_middle">
            <label for="max">Maximum:</label>
            <input type="number" id="max" min="0" step="1" value="300" />
          </div>

          <div class="bottom_right">
            <button id="btn" type="button">Trekk!</button>
          </div>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
